<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% unless page.title == 'Home' %}{{ page.title | escape }} | {% endunless %}Yifei Liu</title>
  <meta name="description" content="{{ page.description | default: site.description | strip | escape }}">
  <meta name="author" content="Yifei Liu">
  <meta property="og:title" content="{% unless page.title == 'Home' %}{{ page.title | escape }} | {% endunless %}Yifei Liu">
  <meta property="og:description" content="{{ page.description | default: site.description | strip | escape }}">
  <meta property="og:type" content="{% if page.collection == 'notes' %}article{% else %}website{% endif %}">
  <meta property="og:image" content="{{ '/assets/img/profile-2026.jpg' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  {% if page.notes_page or page.collection == 'notes' %}
  <link rel="stylesheet" href="{{ '/assets/css/notes.css' | relative_url }}">
  {% endif %}
  {% if page.math %}
  <script src="{{ '/assets/js/notes-math.js' | relative_url }}" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" id="MathJax-script" defer></script>
  {% endif %}
</head>
<body class="academic-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.title == 'Home' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.notes_page or page.collection == 'notes' %} aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/archive.html' | relative_url }}"{% if page.title == 'Archive' %} aria-current="page"{% endif %}>Archive</a>
    </nav>
  </header>
  <main id="main" class="page-width">{{ content }}</main>
  <footer class="site-footer page-width">
    <div class="footer-links">
      <a href="mailto:{{ site.email }}">Email</a>
      <a href="{{ site.scholar_url }}">Scholar</a>
      <a href="https://github.com/{{ site.github_username }}">GitHub</a>
    </div>
    <p>Yifei Liu &middot; <a href="https://keunhong.com/">Design adapted from Keunhong Park</a></p>
  </footer>
</body>
</html>
