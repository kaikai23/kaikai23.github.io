- id: proxy-gs
  title: "Proxy-GS: Unified Occlusion Priors for Training and Inference in Structured 3D Gaussian Splatting"
  authors: "Yuanyuan Gao, Yuning Gong, <strong>Yifei Liu</strong>, Jingfeng Li, Dingwen Zhang, Yanci Zhang, Dan Xu, Xiao Sun, Zhihang Zhong"
  venue: "CVPR, 2026"
  award: "Oral, Best Paper Award Candidate"
  image: /assets/img/publications/proxy-gs.webp
  width: 600
  height: 600
  project: https://visionary-laboratory.github.io/Proxy-GS
  pdf: https://arxiv.org/pdf/2509.24421.pdf
  arxiv: https://arxiv.org/abs/2509.24421
  code: https://github.com/Visionary-Laboratory/Proxy-GS
  summary: "We render a depth map from a proxy mesh to cull occluded Gaussians, eliminating long-overlooked occlusion redundancy in 3DGS. This hybrid rendering strategy leads to large speedups for large-scale rendering under heavy occlusions."

