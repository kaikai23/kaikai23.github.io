- id: maskgaussian
  title: "MaskGaussian: Adaptive 3D Gaussian Representation from Probabilistic Masks"
  authors: "<strong>Yifei Liu</strong>, Zhihang Zhong, Yifan Zhan, Sheng Xu, Xiao Sun"
  venue: "CVPR, 2025"
  image: /assets/img/publications/maskgaussian.webp
  width: 600
  height: 600
  project: https://maskgaussian.github.io/
  pdf: https://openaccess.thecvf.com/content/CVPR2025/papers/Liu_MaskGaussian_Adaptive_3D_Gaussian_Representation_from_Probabilistic_Masks_CVPR_2025_paper.pdf
  arxiv: https://arxiv.org/abs/2412.20522
  code: https://github.com/kaikai23/MaskGaussian
  summary: "We propose a learnable mask for selecting 3D Gaussians during training by incorporating it into the strict rendering equation of 3DGS, and write a custom backward CUDA kernel to avoid vanishing gradients for zeroed Gaussians. This leads to 2x-3x faster rendering with almost no quality degradation."

- id: svit
  title: "Revisiting Token Pruning for Object Detection and Instance Segmentation"
  authors: "<strong>Yifei Liu</strong>, Mathias Gehrig, Nico Messikommer, Marco Cannici, Davide Scaramuzza"
  venue: "WACV, 2024"
  image: /assets/img/publications/svit.webp
  width: 600
  height: 600
  project: /SViT-project-page/index.html
  pdf: https://arxiv.org/pdf/2306.07050.pdf
  code: https://github.com/kaikai23/svit
  summary: "We first adapt token pruning to dense prediction tasks, where directly discarding tokens hurts dense feature maps. By dynamically reactivating unselected tokens, we achieve high pruning rates with little performance loss."
