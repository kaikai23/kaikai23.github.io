- id: holi-spatial
  title: "Holi-Spatial: Evolving Video Streams into Holistic 3D Spatial Intelligence"
  authors: "Yuanyuan Gao*, Hao Li*, <strong>Yifei Liu*</strong>, Xinhao Ji*, Yuning Gong*, Yuanjun Liao, Fangfu Liu, Manyuan Zhang, Yuchen Yang, Dan Xu, ..., Xiao Sun, Dingwen Zhang, Zhihang Zhong"
  venue: "ICML, 2026"
  award: "Oral"
  image: /assets/img/publications/holi-spatial.webp
  width: 600
  height: 600
  project: https://visionary-laboratory.github.io/holi-spatial/
  pdf: https://arxiv.org/pdf/2603.07660.pdf
  arxiv: https://arxiv.org/abs/2603.07660
  code: https://github.com/Visionary-Laboratory/Holi-Spatial
